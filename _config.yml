# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 游手好闲辛大人
subtitle: '热爱技术，热爱生活'
description: '技术博客与个人作品集'
keywords:
author: Cai Zhenxin
language:
  - zh-CN
  - en
timezone: 'Asia/Shanghai'

# URL
url: https://caizhenxin.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fluid

# ============================================================
# 主题配置覆盖（Hexo 原生机制，无需修改 themes/fluid/_config.yml）
# 目的：在导航栏增加「研究 / Research」入口，指向学术主页 /research/
#
# 关于菜单文字如何变成双语的：
#   Fluid 的菜单项文字 = each.name || __(key + '.menu') || __(key + '.title')
#   这里**故意不写 name**，让主题走 __() 翻译查找，于是在
#   themes/fluid/languages/zh-CN.yml 里读到「研究」，
#   在 themes/fluid/languages/en.yml 里读到「Research」。
#   → 中文页面显示「研究」，/en/ 页面显示「Research」，自动切换。
#
# 关于图标：menu 的 icon 必须填「真实存在于 iconfont 里」的类名，
#   写错不会有报错、也不会有提示，只是那个位置一片空白（原 bug 就是如此：
#   之前用的 icon-book-fill 在两套 iconfont 里都不存在）。
#   本站实际加载了**两套** iconfont，它们共用 font-family: "iconfont"，
#   浏览器按字符逐个回退，所以两套的图标都能显示：
#     ① //at.alicdn.com/t/c/font_1749284_5i9bdhy70f8.css  ← Fluid 主题依赖的图标集
#        （home-fill / archive-fill / category-fill / tags-fill / user-fill /
#          search / dark / arrowleft / arrowright / arrowup / arrowdown /
#          articles / list / chart / date / date-fill / clock-fill / cc-* 等）
#     ② //at.alicdn.com/t/c/font_1736178_k526ubmyhba.css  ← theme.iconfont 配置项
#        （book / books / pen / notebook / github-fill / wechat-fill / mail /
#          switch-fill / docker / rss-fill 等）
#   这里选 icon-articles（属于 ①，Fluid 自己保证加载），最稳。
#   想换成更好看的书本图标可以改成 "iconfont icon-book"（属于 ②）。
# ============================================================
theme_config:
  navbar:
    menu:
      - { key: "home",     link: "/",            icon: "iconfont icon-home-fill" }
      - { key: "archive",  link: "/archives/",   icon: "iconfont icon-archive-fill" }
      - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
      - { key: "tag",      link: "/tags/",       icon: "iconfont icon-tags-fill" }
      - { key: "research", link: "/research/",   icon: "iconfont icon-articles" }
      - { key: "about",    link: "/about/",      icon: "iconfont icon-user-fill" }

# Live2D 看板娘
## https://github.com/EYHN/hexo-helper-live2d
live2d:
  enable: true
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  log: false
  model:
    use: live2d-widget-model-hijiki
  display:
    position: right
    width: 150
    height: 300
  mobile:
    show: false
  react:
    opacity: 0.7

# Deployment
deploy:
  type: git
  repo: https://github.com/Caizhenxin/Caizhenxin.github.io.git
  branch: gh-pages
  message: 'deploy: {{ now("YYYY-MM-DD HH:mm:ss") }}'
